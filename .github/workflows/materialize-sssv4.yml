name: Materialize ShangShuSheng build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-sssv4.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'compatibility.json'
      - 'pnpm-lock.yaml'
      - 'tsdown.config.mjs'
      - 'cordis.patch.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm run test:behavior
      - run: pnpm run build
      - run: pnpm run test:delivery
      - name: Commit generated runtime
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml lib
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'build: materialize clean ShangShuSheng Codex runtime'
          git push origin HEAD:main
