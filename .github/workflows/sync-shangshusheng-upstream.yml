name: Sync upstream with ShangShuSheng patch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.shangshusheng-upstream'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/WSL043/dsh-codex-subscription.git 2>/dev/null || true
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          recorded="$(cat .shangshusheng-upstream 2>/dev/null || true)"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [[ "$upstream_sha" == "$recorded" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild thin fork from upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/sync-shangshusheng-upstream.yml "$RUNNER_TEMP/sync.yml"
          git checkout --detach "${{ steps.upstream.outputs.sha }}"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/sync.yml" .github/workflows/sync-shangshusheng-upstream.yml

          node <<'NODE'
          const fs = require('fs')
          const packageFile = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packageFile, 'utf8'))
          const dep = '@deepseek-ai/dsh-home-paths'
          const upstreamRegular = pkg.dependencies?.[dep]
          const upstreamPeer = pkg.peerDependencies?.[dep]
          const upstreamDev = pkg.devDependencies?.[dep]
          const sharedVersion = upstreamPeer || upstreamRegular || upstreamDev
          if (!sharedVersion) throw new Error(`upstream no longer declares ${dep}; review the thin patch before syncing`)

          pkg.name = 'dsh-codex-subscription-sssv4'
          if (pkg.dependencies) delete pkg.dependencies[dep]
          pkg.peerDependencies ||= {}
          pkg.devDependencies ||= {}
          pkg.peerDependencies[dep] = sharedVersion
          pkg.devDependencies[dep] = upstreamDev || upstreamRegular || sharedVersion
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/WenXuan199803/dsh-codex-subscription.git',
          }
          pkg.homepage = 'https://github.com/WenXuan199803/dsh-codex-subscription'
          fs.writeFileSync(packageFile, JSON.stringify(pkg, null, 2) + '\n')

          const patchFile = 'cordis.patch.yml'
          let patch = fs.readFileSync(patchFile, 'utf8')
          patch = patch.replace(/name:\s*['\"]dsh-codex-subscription['\"]/, "name: 'dsh-codex-subscription-sssv4'")
          if (!patch.includes("name: 'dsh-codex-subscription-sssv4'")) throw new Error('could not patch cordis module name')
          fs.writeFileSync(patchFile, patch)

          const buildFile = 'tsdown.config.mjs'
          let build = fs.readFileSync(buildFile, 'utf8')
          build = build.replace("const id = 'dsh-codex-subscription'", "const id = 'dsh-codex-subscription-sssv4'")
          if (!build.includes("const id = 'dsh-codex-subscription-sssv4'")) throw new Error('could not patch client module id')
          fs.writeFileSync(buildFile, build)
          NODE

          printf '%s\n' "${{ steps.upstream.outputs.sha }}" > .shangshusheng-upstream

      - name: Prepare pnpm
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          package_manager="$(node -p "require('./package.json').packageManager || 'pnpm@11.19.0'")"
          corepack prepare "$package_manager" --activate
          pnpm --version

      - name: Refresh lockfile
        if: steps.upstream.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify thin patch and critical Codex paths
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const p = require('./package.json')
          if (p.name !== 'dsh-codex-subscription-sssv4') throw new Error('fork package identity missing')
          if (p.dependencies?.['@deepseek-ai/dsh-home-paths']) throw new Error('dsh-home-paths must not be a regular dependency')
          if (!p.peerDependencies?.['@deepseek-ai/dsh-home-paths']) throw new Error('dsh-home-paths peer dependency missing')
          if (!fs.readFileSync('cordis.patch.yml', 'utf8').includes("name: 'dsh-codex-subscription-sssv4'")) throw new Error('cordis patch identity mismatch')
          if (!fs.readFileSync('tsdown.config.mjs', 'utf8').includes("const id = 'dsh-codex-subscription-sssv4'")) throw new Error('client module identity mismatch')
          NODE
          node --test \
            tests/account-vault.test.mjs \
            tests/auth-security.test.mjs \
            tests/oauth-network.test.mjs \
            tests/transport-contract.test.mjs \
            tests/codex-search.test.mjs \
            tests/codex-images.test.mjs
          pnpm run build
          grep -q 'dsh-codex-subscription-sssv4' lib/client.js
          rm -rf .artifacts
          pnpm pack --pack-destination .artifacts
          test -s "$(find .artifacts -maxdepth 1 -type f -name '*.tgz' -print -quit)"

      - name: Commit synchronized fork
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json pnpm-lock.yaml cordis.patch.yml tsdown.config.mjs lib \
            .shangshusheng-upstream .github/workflows/sync-shangshusheng-upstream.yml
          git commit -m "sync: upstream ${{ steps.upstream.outputs.sha }} + ShangShuSheng patch"

      - name: Publish verified sync
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git push --force-with-lease origin HEAD:main
